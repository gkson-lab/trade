# Run the trading box in the cloud on GitHub's free runners (free for public repositories).
# Start it from the Actions tab -> "Simulate" -> "Run workflow". Each run saves its data:
#   - as a workflow artifact (downloadable for 90 days), and
#   - as a GitHub Release named run-<number> (kept until you delete it), which the "Train" workflow reads.
name: Simulate
on:
  workflow_dispatch:
    inputs:
      generations:
        description: "Generations (0 = keep going until the time limit)"
        default: "0"
      minutes:
        description: "Stop after this many minutes (up to 330). A GitHub runner simulates ~200 trading days a minute, ~15 MB of gzipped data at 150 samples a day"
        default: "60"
      days:
        description: "Trading days per generation"
        default: "10"
      mult:
        description: "Population multiplier (1 = 20 bots, 2 = 40 ...)"
        default: "1"
      breeding:
        description: "Breeding preset (node cli.js --list-breeding shows them all)"
        default: "ranked"
      samples:
        description: "Training samples per day (the biggest table; 50 keeps files small)"
        default: "50"
      seed:
        description: "Seed (blank = use the run number)"
        default: ""
      release:
        description: "Save the data as a GitHub Release"
        type: boolean
        default: true
      send_to_docs:
        description: "Trading data bot: open a pull request in gk-research-group/internal-documents- (needs the DOCS_TOKEN secret)"
        type: boolean
        default: true
  # To run on a timer as well, uncomment these two lines (cron is in UTC; this is daily at 06:17).
  # schedule:
  #   - cron: "17 6 * * *"

permissions:
  contents: write   # needed to create the release

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the box
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_TOKEN }}
          SEND_DOCS: ${{ github.event_name == 'schedule' || inputs.send_to_docs }}
          GENS: ${{ inputs.generations || '0' }}
          MINUTES: ${{ inputs.minutes || '60' }}
          DAYS: ${{ inputs.days || '10' }}
          MULT: ${{ inputs.mult || '1' }}
          BREEDING: ${{ inputs.breeding || 'ranked' }}
          SAMPLES: ${{ inputs.samples || '50' }}
          SEED: ${{ inputs.seed || github.run_number }}
        run: |
          if [ "$GENS" = "0" ]; then G="--forever"; else G="--gens $GENS"; fi
          PUSH=""
          if [ "$SEND_DOCS" = "true" ]; then
            if [ -n "$DOCS_TOKEN" ]; then PUSH="--push-docs --docs-link https://github.com/${{ github.repository }}/releases/tag/run-${{ github.run_number }}"
            else echo "::notice::Trading data bot skipped: add a DOCS_TOKEN secret (fine-grained token for gk-research-group/internal-documents-, Contents and Pull requests read/write)."; fi
          fi
          node cli.js $G --max-minutes "$MINUTES" --days "$DAYS" --mult "$MULT" --breeding "$BREEDING" \
            --samples "$SAMPLES" --seed "$SEED" --gzip --out out $PUSH
          mkdir -p dist-run
          tar -czf "dist-run/trade-box-run-${{ github.run_number }}.tar.gz" -C out .
          # GitHub release files max out at 2 GB: split big archives into 1.9 GB parts (train.yml joins them)
          f="dist-run/trade-box-run-${{ github.run_number }}.tar.gz"
          if [ "$(stat -c %s "$f")" -gt 1900000000 ]; then split -b 1900m -d "$f" "$f.part-" && rm "$f"; fi
          du -sh out dist-run/*
      - uses: actions/upload-artifact@v4
        with:
          name: trade-box-run-${{ github.run_number }}
          path: dist-run/
          retention-days: 90
      - name: Save as a release
        if: ${{ github.event_name == 'schedule' || inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "run-${{ github.run_number }}" dist-run/* \
            --title "Simulation run ${{ github.run_number }}" \
            --notes "Seed ${{ inputs.seed || github.run_number }}, breeding ${{ inputs.breeding || 'ranked' }}, ${{ inputs.days || '10' }} days per generation, x${{ inputs.mult || '1' }} population. Gzipped CSVs; see docs/DATASET.md."
